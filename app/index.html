<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>街と、その白い壁 〜The City and Its White Squid〜</title>
<meta name="description" content="街と、その白い壁：タコを はじいて、白い 壁に まもられた イカを たおす 見下ろし型の 物理パズル。ブラウザで すぐ あそべる、通信なしの ゲーム">
<meta name="theme-color" content="#23506e">

<!-- ホーム画面に くわえた ときの アイコンと なまえ -->
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="街と、その白い壁">

<link rel="stylesheet" href="story.css">
<link rel="stylesheet" href="style.css">
<link rel="canonical" href="https://pikaring.github.io/throw-on-tako/app/">
</head>
<body>

  <!-- ===== ヘッダー：面と レベル・イカの 体力・ひとこと ===== -->
  <header class="header">
    <div class="status">
      <span class="status__stage" id="stageName">1面 通学路の 壁</span>
      <span class="status__level" id="levelName">1-1</span>
    </div>

    <!-- イカの 体力（のこり） -->
    <div class="meter">
      <div class="gauge" role="progressbar" aria-label="イカの たいりょく" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="gauge">
        <div class="gauge__bar" id="gaugeBar"></div>
        <div class="gauge__goal" id="gaugeGoal"></div>
      </div>
      <p class="meter__text"><b id="ratioText">♥</b><span class="meter__goal" id="goalText">イカの たいりょく</span></p>
    </div>

    <p class="message" id="message" role="status" aria-live="polite">タコを ひっぱって はなすと 投げるよ！</p>
  </header>

  <!-- ===== まんなか：見下ろしの 台（TakoGame が 描く） ===== -->
  <main class="field" id="field">
    <canvas class="field__canvas" id="canvas" tabindex="0" aria-label="タコを はじく 台。画面を ひっぱって はなすと、下から タコが とびだす。キーボードでは 左右の 矢印で 向き、上下で 強さ、スペースで 投げる"></canvas>
    <p class="field__nogame" id="noGame" hidden>ゲームを じゅんび しています…</p>
  </main>

  <!-- ===== した：タコの トレイ・投げる 人・ボタン ===== -->
  <footer class="controls">
    <section class="tray" aria-label="投げる タコ">
      <div class="tray__list" id="trayList" role="radiogroup" aria-label="タコを えらぶ"></div>
      <p class="tray__note" id="trayNote">タコ一郎：ふつうの タコ</p>
    </section>

    <section class="throwers" aria-label="投げる 人">
      <div class="throwers__list" id="throwerList" role="radiogroup" aria-label="投げる 人を えらぶ"></div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn--again" id="btnRetry">
        <span class="btn__icon" aria-hidden="true">🔄</span>
        <span class="btn__text">やりなおす</span>
      </button>
      <button type="button" class="btn btn--title" id="btnTitle">
        <span class="btn__icon" aria-hidden="true">🏠</span>
        <span class="btn__text">タイトル</span>
      </button>
    </div>
  </footer>

  <!-- ===== レベルの おわり（クリア／失敗） ===== -->
  <div class="modal" id="endModal" hidden>
    <div class="modal__panel modal__panel--end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <h2 class="modal__title" id="endTitle">1-1 クリア！</h2>
      <p class="end__stars" id="endStars" aria-label="ほし 3つ">★★★</p>
      <p class="end__text" id="endText"></p>
      <div class="end__actions">
        <button type="button" class="btn btn--kind" id="btnEndMain">
          <span class="btn__text" id="endMainText">つぎへ</span>
        </button>
        <button type="button" class="btn btn--close" id="btnEndSub">
          <span class="btn__text" id="endSubText">きょうは ここまで</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== えらんで あそぶ ===== -->
  <div class="modal" id="pickModal" hidden>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
      <h2 class="modal__title" id="pickTitle">レベルを えらぶ</h2>
      <div class="picks" id="pickList"></div>
      <p class="modal__note">クリアした レベルと、つぎの レベルを えらべます</p>
      <button type="button" class="btn btn--close" id="btnPickClose">
        <span class="btn__text">とじる</span>
      </button>
    </div>
  </div>

<script src="story-data.js"></script>
<script src="story.js"></script>
<script src="stages.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
